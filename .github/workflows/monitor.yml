name: 境川水位監視

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 水位取得・判定・通知
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py

      - name: データをcommit
        run: |
          git config user.name "sakaigawa-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add generated/data/levels/ generated/data/rain/ generated/state.json generated/assets/ generated/STATUS.md
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: 水位データ更新 [skip ci]"
          git pull --rebase origin main
          git push
